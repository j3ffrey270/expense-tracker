<ion-content class="page-content">
  <div class="auth-wrapper">
    <div class="auth-grid">

      <div class="hero-column">
        <div class="hero-brand">
          <div class="brand-badge">
            <ion-icon name="wallet"></ion-icon>
          </div>
          <span class="brand-name">Expense<span class="brand-highlight">Tracker</span></span>
        </div>

        <div class="hero-illustration-wrapper">
          <img [src]="isRegisterMode ? 'assets/images/register_hero.png' : 'assets/images/login_hero.png'"
            alt="Expense Tracker Hero Graphic" class="hero-img" />
        </div>
      </div>

      <div class="form-column">
        <div class="mobile-brand">
          <div class="brand-badge">
            <ion-icon name="wallet"></ion-icon>
          </div>
          <span class="brand-name">Expense<span class="brand-highlight">Tracker</span></span>
        </div>

        <div class="form-header">
          <h1 class="form-title">{{ isRegisterMode ? 'Create Account' : 'Welcome Back!' }}</h1>
          <p class="form-subtitle">
            {{ isRegisterMode ? 'Sign up to get started' : 'Login to your account' }}
          </p>
        </div>

        <form (ngSubmit)="submitForm()" class="auth-form">
          <div *ngIf="isRegisterMode" class="form-group">
            <label class="field-label">Full Name</label>
            <div class="input-wrapper">
              <input type="text" class="custom-input" placeholder="Enter your full name" [(ngModel)]="name" name="name"
                required />
            </div>
          </div>

          <div class="form-group">
            <label class="field-label">Email address</label>
            <div class="input-wrapper">
              <input type="email" class="custom-input" placeholder="Enter your email (e.g. name@gmail.com)" [(ngModel)]="email" name="email"
                required />
            </div>
          </div>

          <div class="form-group">
            <label class="field-label">Password</label>
            <div class="input-wrapper password-wrapper">
              <input [type]="showPassword ? 'text' : 'password'" class="custom-input" placeholder="Enter your password (min 6 characters)"
                [(ngModel)]="password" name="password" minlength="6" required />
              <button type="button" class="eye-toggle-btn" (click)="togglePasswordVisibility()">
                <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </button>
            </div>
          </div>

          <div *ngIf="isRegisterMode" class="form-group">
            <label class="field-label">Confirm Password</label>
            <div class="input-wrapper password-wrapper">
              <input [type]="showConfirmPassword ? 'text' : 'password'" class="custom-input"
                placeholder="Confirm your password (min 6 characters)" [(ngModel)]="confirmPassword" name="confirmPassword" minlength="6" required />
              <button type="button" class="eye-toggle-btn" (click)="toggleConfirmPasswordVisibility()">
                <ion-icon [name]="showConfirmPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </button>
            </div>
          </div>

          <button type="submit" class="primary-submit-btn" [disabled]="isLoading">
            <ion-spinner *ngIf="isLoading" name="crescent"></ion-spinner>
            <span *ngIf="!isLoading">{{ isRegisterMode ? 'Register' : 'Login' }}</span>
          </button>
        </form>



        <div class="switch-mode-container">
          <span class="switch-prompt">
            {{ isRegisterMode ? 'Already have an account?' : "Don't have an account?" }}
          </span>
          <button type="button" class="switch-link-btn" (click)="setMode(!isRegisterMode)">
            {{ isRegisterMode ? 'Login' : 'Sign up' }}
          </button>
        </div>

      </div>

    </div>
  </div>
</ion-content>
